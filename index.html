  <style>
    * { font-family: 'Quicksand', sans-serif; }
    .title-font { font-family: 'Caveat', cursive; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 105, 180, 0.3); }
      50% { box-shadow: 0 0 40px rgba(255, 105, 180, 0.6); }
    }
    
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(1); }
      75% { transform: scale(1.1); }
    }
    
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
    
    @keyframes sakura-fall {
      0% { transform: translateY(-10%) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110%) rotate(360deg); opacity: 0; }
    }
    
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes character-enter-left {
      from { opacity: 0; transform: translateX(-100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes character-enter-right {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    @keyframes blush {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    .float-animation { animation: float 3s ease-in-out infinite; }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .heartbeat { animation: heartbeat 1s ease-in-out infinite; }
    .fade-in { animation: fade-in 0.5s ease-out forwards; }
    .slide-up { animation: slide-up 0.6s ease-out forwards; }
    .char-left { animation: character-enter-left 0.8s ease-out forwards; }
    .char-right { animation: character-enter-right 0.8s ease-out forwards; }
    .blush-anim { animation: blush 2s ease-in-out infinite; }
    
    .sakura {
      position: absolute;
      width: 15px;
      height: 15px;
      background: linear-gradient(135deg, #ffb7c5 0%, #ff69b4 100%);
      border-radius: 50% 0 50% 50%;
      animation: sakura-fall linear infinite;
      pointer-events: none;
    }
    
    .dialogue-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,240,245,0.95) 100%);
      border: 3px solid #ff69b4;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255,105,180,0.3);
    }
    
    .choice-btn {
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 100%);
      border: 2px solid #ff69b4;
      transition: all 0.3s ease;
    }
    
    .choice-btn:hover {
      background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255,105,180,0.4);
    }
    
    .character-sprite {
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
    }
    
    .text-reveal {
      overflow: hidden;
      white-space: pre-wrap;
    }
    
    .bg-scene {
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
    }
    
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,105,180,0.4);
      transition: all 0.3s ease;
    }
    
    .music-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255,105,180,0.6);
    }
    
    .save-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }
    
    .progress-bar {
      height: 4px;
      background: linear-gradient(90deg, #ff69b4, #ff1493, #ff69b4);
      background-size: 200% 100%;
      animation: gradient-shift 2s linear infinite;
    }
    
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    
    .notification {
      position: fixed;
      top: 80px;
      right: 20px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(34,197,94,0.4);
      z-index: 1001;
      animation: slide-up 0.3s ease-out;
    }
    
    .heart-particle {
      position: absolute;
      font-size: 20px;
      animation: float 2s ease-in-out infinite;
      pointer-events: none;
    }
  </style>

        sinta_angry: { emoji: "😤", color: "from-pink-400 to-rose-500", name: "Sinta" },
        sinta_blush: { emoji: "😳", color: "from-pink-400 to-rose-500", name: "Sinta" },
        sinta_shocked: { emoji: "😲", color: "from-pink-400 to-rose-500", name: "Sinta" },
        sinta_smile: { emoji: "😊", color: "from-pink-400 to-rose-500", name: "Sinta" },
        sinta_panic: { emoji: "😰", color: "from-pink-400 to-rose-500", name: "Sinta" },

      };
      return sprites[type] || { emoji: "👤", color: "from-gray-400 to-gray-600", name: "???" };
    }
    
    // ==================== SAKURA PARTICLES ====================
    function createSakura(container) {
      const sakura = document.createElement('div');
      sakura.className = 'sakura';
      sakura.style.left = Math.random() * 100 + '%';
      sakura.style.animationDuration = (Math.random() * 3 + 4) + 's';
      sakura.style.animationDelay = Math.random() * 5 + 's';
      sakura.style.opacity = Math.random() * 0.5 + 0.5;
      sakura.style.transform = `scale(${Math.random() * 0.5 + 0.5})`;
      container.appendChild(sakura);
      
      setTimeout(() => sakura.remove(), 10000);
    }
    
    function startSakuraAnimation() {
      const container = document.getElementById('sakuraContainer');
      if (!container) return;
      
      setInterval(() => {
        if (document.getElementById('titleScreen').classList.contains('hidden')) return;
        createSakura(container);
      }, 300);
    }
    
    // ==================== MUSIC CONTROL ====================
    function toggleMusic() {
      const music = document.getElementById('bgMusic');
      const icon = document.getElementById('musicIcon');
      
      if (gameState.musicPlaying) {
        music.pause();
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>';
      } else {
        music.play().catch(e => console.log('Audio play failed:', e));
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>';
      }
      gameState.musicPlaying = !gameState.musicPlaying;
    }
    
    // ==================== GAME FUNCTIONS ====================
    function startGame() {
      document.getElementById('titleScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      
      gameState.chapter = 1;
      gameState.scene = 0;
      currentSceneIndex = 0;
      
      showChapterTitle(1);
    }
    
    function showChapterTitle(chapter) {
      const overlay = document.getElementById('chapterOverlay');
      const title = document.getElementById('chapterTitle');
      const subtitle = document.getElementById('chapterSubtitle');
      
      title.textContent = storyData[chapter].title;
      subtitle.textContent = storyData[chapter].subtitle;
      
      overlay.classList.remove('hidden');
      
      setTimeout(() => {
        overlay.classList.add('hidden');
        showScene();
      }, 3000);
    }
    
    function showScene() {
      const chapter = storyData[gameState.chapter];
      if (!chapter) {
        showEnding();
        return;
      }
      
      const scene = chapter.scenes[gameState.scene];
      if (!scene) {
        // Next chapter
        gameState.chapter++;
        gameState.scene = 0;
        
        if (storyData[gameState.chapter]) {
          showChapterTitle(gameState.chapter);
        } else {
          showEnding();
        }
        return;
      }
      
      // Update progress bar
      updateProgress();
      
      // Update background
      const bg = document.getElementById('sceneBackground');
      bg.style.background = backgrounds[scene.background] || backgrounds.school_gate;
      
      // Update characters
      updateCharacters(scene.characters);
      
      // Update speaker name
      const speakerEl = document.getElementById('speakerName');
      speakerEl.textContent = scene.speaker;
      
      // Color speaker name based on who's talking
      if (scene.speaker === "Rifky") {
        speakerEl.className = "absolute -top-4 left-6 bg-gradient-to-r from-blue-500 to-blue-600 text-white px-6 py-1 rounded-full font-bold text-lg shadow-lg";
      } else if (scene.speaker === "Sinta") {
        speakerEl.className = "absolute -top-4 left-6 bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-1 rounded-full font-bold text-lg shadow-lg";
      } else {
        speakerEl.className = "absolute -top-4 left-6 bg-gradient-to-r from-gray-500 to-gray-600 text-white px-6 py-1 rounded-full font-bold text-lg shadow-lg";
      }
      
      // Type text effect
      typeText(scene.text);
    }
    
    function updateCharacters(characters) {
      const container = document.getElementById('charactersContainer');
      container.innerHTML = '';
      
      characters.forEach((charType, index) => {
        const sprite = getCharacterSprite(charType);
        const charDiv = document.createElement('div');
        charDiv.className = `text-center mx-4 ${index === 0 ? 'char-left' : 'char-right'}`;
        charDiv.innerHTML = `
          <div class="w-24 h-24 md:w-32 md:h-32 rounded-full bg-gradient-to-br ${sprite.color} flex items-center justify-center text-5xl md:text-6xl shadow-xl character-sprite float-animation">
            ${sprite.emoji}
          </div>
          <p class="mt-2 font-bold ${sprite.name === 'Rifky' ? 'text-blue-600' : 'text-pink-600'} text-lg">${sprite.name}</p>
        `;
        container.appendChild(charDiv);
      });
    }
    
    function typeText(text) {
      const textEl = document.getElementById('dialogueText');
      const continueEl = document.getElementById('continueIndicator');
      
      gameState.isTyping = true;
      gameState.currentText = text;
      gameState.textIndex = 0;
      
      textEl.textContent = '';
      continueEl.classList.add('hidden');
      
      function type() {
        if (gameState.textIndex < gameState.currentText.length) {
          textEl.textContent += gameState.currentText[gameState.textIndex];
          gameState.textIndex++;
          setTimeout(type, 30);
        } else {
          gameState.isTyping = false;
          continueEl.classList.remove('hidden');
        }
      }
      
      type();
    }
    
    function skipText() {
      if (gameState.isTyping) {
        const textEl = document.getElementById('dialogueText');
        const continueEl = document.getElementById('continueIndicator');
        
        textEl.textContent = gameState.currentText;
        gameState.isTyping = false;
        continueEl.classList.remove('hidden');
      }
    }
    
    function nextScene() {
      if (gameState.isTyping) {
        skipText();
        return;
      }
      
      gameState.scene++;
      currentSceneIndex++;
      showScene();
    }
    
    function updateProgress() {
      const progress = (currentSceneIndex / totalScenes) * 100;
      document.getElementById('progressBar').style.width = progress + '%';
    }
    
    function showEnding() {
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('endingScreen').classList.remove('hidden');
      document.getElementById('endingScreen').classList.add('flex');
      
      document.getElementById('endingText').textContent = 
        "Terima kasih telah membaca kisah cinta Rifky dan Sinta. Semoga cerita ini menyentuh hatimu! 💕";
      
      // Start sakura in ending
      const container = document.getElementById('sakuraEndContainer');
      setInterval(() => {
        createSakura(container);
      }, 300);
    }
    
    function restartGame() {
      document.getElementById('endingScreen').classList.add('hidden');
      document.getElementById('endingScreen').classList.remove('flex');
      document.getElementById('titleScreen').classList.remove('hidden');
      
      gameState.chapter = 1;
      gameState.scene = 0;
      gameState.affection = 50;
      currentSceneIndex = 0;
    }
    
    // ==================== SAVE/LOAD ====================
    async function saveGame() {
      const saveData = {
        save_slot: 'slot_1',
        chapter: gameState.chapter,
        scene: gameState.scene,
        player_name: 'Player',
        affection: gameState.affection,
        choices_made: JSON.stringify(gameState.choicesMade),
        saved_at: new Date().toISOString()
      };
      
      if (window.dataSdk) {
        const existing = saves.find(s => s.save_slot === 'slot_1');
        if (existing) {
          const result = await window.dataSdk.update({ ...existing, ...saveData });
          if (result.isOk) showNotification('Game tersimpan!');
        } else {
          const result = await window.dataSdk.create(saveData);
          if (result.isOk) showNotification('Game tersimpan!');
        }
      }
    }
    
    async function loadGame(save) {
      gameState.chapter = save.chapter;
      gameState.scene = save.scene;
      gameState.affection = save.affection;
      gameState.choicesMade = JSON.parse(save.choices_made || '[]');
      
      // Calculate current scene index
      currentSceneIndex = 0;
      for (let i = 1; i < save.chapter; i++) {
        if (storyData[i]) currentSceneIndex += storyData[i].scenes.length;
      }
      currentSceneIndex += save.scene;
      
      hideLoadMenu();
      document.getElementById('titleScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      showScene();
      showNotification('Game dimuat!');
    }
    
    function showLoadMenu() {
      const menu = document.getElementById('loadMenu');
      const slots = document.getElementById('saveSlots');
      
      slots.innerHTML = '';
      
      if (saves.length === 0) {
        slots.innerHTML = '<p class="text-center text-gray-500">Belum ada save data</p>';
      } else {
        saves.forEach(save => {
          const chapter = storyData[save.chapter];
          const btn = document.createElement('button');
          btn.className = 'w-full bg-gradient-to-r from-pink-100 to-rose-100 p-4 rounded-xl text-left hover:from-pink-200 hover:to-rose-200 transition-all';
          btn.innerHTML = `
            <p class="font-bold text-pink-600">Chapter ${save.chapter}: ${chapter ? chapter.title : 'Unknown'}</p>
            <p class="text-sm text-gray-500">Scene ${save.scene + 1} | ${new Date(save.saved_at).toLocaleDateString('id-ID')}</p>
          `;
          btn.onclick = () => loadGame(save);
          slots.appendChild(btn);
        });
      }
      
      menu.classList.remove('hidden');
    }
    
    function hideLoadMenu() {
      document.getElementById('loadMenu').classList.add('hidden');
    }
    
    function showNotification(text) {
      const notif = document.getElementById('notification');
      notif.textContent = text;
      notif.classList.remove('hidden');
      
      setTimeout(() => {
        notif.classList.add('hidden');
      }, 2000);
    }
    
    // ==================== EVENT LISTENERS ====================
    document.getElementById('dialogueBox').addEventListener('click', nextScene);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        nextScene();
      }
    });
    
    // ==================== SDK INITIALIZATION ====================
    const dataHandler = {
      onDataChanged(data) {
        saves = data;
      }
    };
    
    async function initSDKs() {
      // Initialize Element SDK
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (cfg) => {
            config = cfg;
            document.title = config.game_title || defaultConfig.game_title;
          },
          mapToCapabilities: (cfg) => ({
            recolorables: [],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: (cfg) => new Map([
            ["game_title", cfg.game_title || defaultConfig.game_title]
          ])
        });
      }
      
      // Initialize Data SDK
      if (window.dataSdk) {
        await window.dataSdk.init(dataHandler);
      }
      
      // Start animations
      startSakuraAnimation();
    }
    
    initSDKs();
  </script>
